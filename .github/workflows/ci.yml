name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  backend:
    name: backend (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.13"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy app

      - name: Tests (pytest)
        run: uv run pytest -q

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  eval-gate:
    name: eval-gate (metrics · regression · target bars)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.13"

      # The eval dependency group (textstat) is not installed by default.
      - name: Sync dependencies (+ eval group)
        run: uv sync --frozen --group eval

      # Metrics + the gate's fail-on-regression logic.
      - name: Eval unit tests
        run: uv run pytest ../eval/tests -q

      # Run the harness on the in-memory synthetic fixture (real PDFs are gitignored),
      # failing the build if a headline metric regresses past the docs/05 §6 bars.
      - name: Eval-gate (synthetic fixture)
        run: uv run python ../eval/run_eval.py --synthetic --fail-on-target-miss --label ci

  # Production deploy, only from master and only once every gate above is green.
  # Requires four repository secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
  # (a private key whose public half is in the server's authorized_keys) and
  # DEPLOY_KNOWN_HOSTS (`ssh-keyscan -H <host>` output, so the host key is pinned
  # rather than blindly accepted).
  deploy:
    name: deploy (production)
    needs: [backend, frontend, eval-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45 # a cold rebuild of every image is slow but bounded
    concurrency:
      group: production-deploy
      cancel-in-progress: false # never interrupt a half-finished deploy
    environment:
      name: production
      url: https://unipress.gilbertmutai.com
    steps:
      - name: Authorise SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Deploy the commit that triggered this run, not "whatever master is now",
      # so a push landing mid-deploy cannot be shipped untested. reset --hard is
      # safe because the server holds no local edits; anything uncommitted there
      # would be a mistake, and this surfaces it rather than merging around it.
      - name: Deploy ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -euo pipefail
             cd /opt/unipress-de
             git fetch --prune origin
             git checkout -B master --track origin/master 2>/dev/null || git checkout master
             git reset --hard ${{ github.sha }}
             DOMAIN=unipress.gilbertmutai.com ops/deploy.sh --no-pull"

      # deploy.sh already verifies from inside the network; this is the outside
      # view, which is the one that matters to a visitor.
      - name: Verify the public edge
        run: |
          set -euo pipefail
          for path in / /api/health /api/docs; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 20 \
              "https://unipress.gilbertmutai.com${path}")
            echo "  ${path} -> ${code}"
          done
          # The served page must point at /api, not a baked-in localhost.
          curl -fsS --max-time 20 https://unipress.gilbertmutai.com/ | grep -q 'href="/api/' \
            || { echo "::error::frontend was not built for single origin"; exit 1; }
