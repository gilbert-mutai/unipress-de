name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  backend:
    name: backend (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.13"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy app

      - name: Tests (pytest)
        run: uv run pytest -q

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  eval-gate:
    name: eval-gate (metrics · regression · target bars)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.13"

      # The eval dependency group (textstat) is not installed by default.
      - name: Sync dependencies (+ eval group)
        run: uv sync --frozen --group eval

      # Metrics + the gate's fail-on-regression logic.
      - name: Eval unit tests
        run: uv run pytest ../eval/tests -q

      # Run the harness on the in-memory synthetic fixture (real PDFs are gitignored),
      # failing the build if a headline metric regresses past the docs/05 §6 bars.
      - name: Eval-gate (synthetic fixture)
        run: uv run python ../eval/run_eval.py --synthetic --fail-on-target-miss --label ci
