# UniPress DE — single-origin reverse proxy (docs/07 §9, docs/08 P6).
#   /api/*  -> api:8000 (prefix stripped)   ·   /*  -> frontend:3000
# HTTP phase: serves the app over :80 and the ACME challenge so Certbot can issue a
# cert. After issuance this file is swapped for the TLS version (80 -> 443 redirect).

server {
    listen 80;
    server_name unipress.gilbertmutai.com;

    # Uploads: the api caps at 30 MB (docs P4); allow a little headroom.
    client_max_body_size 40m;

    # Let's Encrypt HTTP-01 challenge (served from the shared certbot webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API — trailing slash on proxy_pass strips the /api prefix:
    #   /api/documents/123  ->  http://api:8000/documents/123
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Everything else -> the Next.js server (incl. /_next static assets).
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
