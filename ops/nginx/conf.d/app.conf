# UniPress DE — single-origin reverse proxy + TLS (docs/07 §9, docs/08 P6).
#   /api/*  -> api:8000 (prefix stripped)   ·   /*  -> frontend:3000
# Port 80 keeps serving the ACME challenge (for renewals) and redirects all else to 443.

server {
    listen 80;
    server_name unipress.gilbertmutai.com;

    # Let's Encrypt HTTP-01 challenge (renewals) — served from the shared webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else -> HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name unipress.gilbertmutai.com;

    ssl_certificate     /etc/letsencrypt/live/unipress.gilbertmutai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unipress.gilbertmutai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Uploads: the api caps at 30 MB (docs P4); allow a little headroom.
    client_max_body_size 40m;

    # API — trailing slash on proxy_pass strips the /api prefix:
    #   /api/documents/123  ->  http://api:8000/documents/123
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Everything else -> the Next.js server (incl. /_next static assets).
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
