# UniPress DE — single-origin reverse proxy + TLS (docs/07 §9, docs/08 P6).
#   /api/*  -> api:8000 (prefix stripped)   ·   /*  -> frontend:3000
# Port 80 keeps serving the ACME challenge (for renewals) and redirects all else to 443.

server {
    listen 80;
    server_name unipress.gilbertmutai.com;

    # Let's Encrypt HTTP-01 challenge (renewals) — served from the shared webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else -> HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name unipress.gilbertmutai.com;

    # Docker's embedded DNS. nginx normally resolves upstream names once, at
    # config load, so a recreated api/frontend container (new IP) makes every
    # request 502 until nginx is reloaded. Resolving through this, with the
    # upstream held in a variable, re-resolves per request instead.
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/unipress.gilbertmutai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unipress.gilbertmutai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Uploads: the api caps at 30 MB (docs P4); allow a little headroom.
    client_max_body_size 40m;

    # Grafana dashboard (served under /grafana via GF_SERVER_SERVE_FROM_SUB_PATH).
    location = /grafana { return 301 /grafana/; }
    location /grafana/ {
        set $grafana_upstream grafana:3000;
        # No URI part after the variable, so the original /grafana/… path is
        # passed through unchanged (Grafana serves from that sub-path).
        proxy_pass http://$grafana_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # Prometheus scrapes api:8000/metrics over the compose network, so the public
    # origin has no reason to serve it — it exposes queue depth, per-handler
    # request counts and the LLM token/cost counters. 404 rather than 403 so the
    # endpoint isn't advertised at all. Must precede the /api/ block below.
    location = /api/metrics {
        return 404;
    }

    # API — the rewrite strips the /api prefix, since a proxy_pass holding a
    # variable cannot also carry the URI that would do it:
    #   /api/documents/123  ->  http://api:8000/documents/123
    location /api/ {
        set $api_upstream api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Everything else -> the Next.js server (incl. /_next static assets).
    location / {
        set $frontend_upstream frontend:3000;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
