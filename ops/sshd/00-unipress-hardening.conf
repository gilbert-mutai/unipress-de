# UniPress DE — pre-demo SSH hardening (30 Jul 2026).
# Named 00- deliberately: sshd honours the FIRST occurrence of a keyword, and
# 50-cloud-init.conf sets "PasswordAuthentication yes", so a 99- file is ignored.
# Root login is intentionally left enabled — it is currently the only access
# route, and the key is installed. Revisit with ops/harden.sh once a keyed
# non-root sudo user exists.
PasswordAuthentication no
KbdInteractiveAuthentication no
