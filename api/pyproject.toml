[project]
name = "unipress-api"
version = "0.1.0"
description = "UniPress DE — API + Celery worker (FastAPI, Celery, Postgres)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.2",
    "flower>=2.0",
    "pymupdf>=1.24",
    "python-multipart>=0.0.12",
    "litellm>=1.50",
    "torch>=2.2",
    "chromadb==1.5.9",  # client MUST match the chroma server image tag (docker-compose.yml)
    "sentence-transformers>=3.0",
    "jinja2>=3.1",
    "weasyprint>=63",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "tenacity>=9.0",
    "prometheus-fastapi-instrumentator>=7.0",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-celery>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

# CPU-only torch (docs/07): avoids multi-GB CUDA wheels. sentence-transformers
# pulls torch; force it to resolve from PyTorch's CPU index.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection defaults are calls by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
